# Ambiente de DESENVOLVIMENTO. Produção usa docker-compose.prod.yml (Sprint 0).
# Só web (8000) e Mailpit (8025) expõem porta; banco e redis ficam na rede interna.

# Nome fixo do projeto: o volume do banco é sempre "negocios-diarios_pgdata",
# mesmo que a pasta seja clonada com outro nome (senão nasceria um banco vazio novo).
name: negocios-diarios

# Base comum do web e do worker: mesma imagem, mesmo .env, código montado em /app.
x-app: &app
  build:
    context: .
    args: {INSTALAR_DEV: "true"}         # traz pytest e ruff para a imagem de dev
  env_file: .env
  volumes: [.:/app]                      # inclui media/ (ARMAZENAMENTO=local, docs/adr/0002)

services:
  db:
    image: postgis/postgis:16-3.4        # PostgreSQL + PostGIS (geolocalização)
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s

  redis:                                 # fila do Celery
    image: redis:7.4-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}

  web:
    <<: *app
    command: python manage.py runserver 0.0.0.0:8000
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/saude/')"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:                                # Celery: tarefas assíncronas (e-mails...) + agendadas (beat)
    <<: *app
    # -B liga o agendador junto (só em dev; em produção o beat roda separado, etapa 8).
    # O arquivo do agendador fica em /tmp para não aparecer na pasta do projeto.
    command: celery -A config worker -B -l info --concurrency 2 --schedule /tmp/celerybeat-schedule
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
      mailpit: {condition: service_started}

  mailpit:                               # captura todos os e-mails em dev: http://localhost:8025
    image: axllent/mailpit:v1.31.5
    ports: ["8025:8025"]                 # só a tela; o SMTP (1025) fica na rede interna

volumes:
  pgdata:
