# Ambiente de DESENVOLVIMENTO. Produção usa docker-compose.prod.yml (Sprint 0).
# Só o "web" expõe porta; banco e redis ficam na rede interna.

# Nome fixo do projeto: o volume do banco é sempre "negocios-diarios_pgdata",
# mesmo que a pasta seja clonada com outro nome (senão nasceria um banco vazio novo).
name: negocios-diarios

services:
  db:
    image: postgis/postgis:16-3.4        # PostgreSQL + PostGIS (geolocalização)
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s

  redis:
    image: redis:7.4-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}

  web:
    build:
      context: .
      args: {INSTALAR_DEV: "true"}       # traz pytest e ruff para a imagem de dev
    command: python manage.py runserver 0.0.0.0:8000
    env_file: .env
    volumes: [.:/app]
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/saude/')"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Celery entra na etapa 6 da Sprint 0; até lá o worker fica desligado.
  # worker:
  #   build:
  #     context: .
  #     args: {INSTALAR_DEV: "true"}
  #   command: celery -A config worker -B -l info   # tarefas assíncronas + agendadas
  #   env_file: .env
  #   volumes: [.:/app]
  #   depends_on: [db, redis]

  minio:                                 # storage S3 local para fotos
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    ports: ["9001:9001"]
    volumes: [miniodata:/data]

  mailpit:                               # captura e-mails em dev
    image: axllent/mailpit:v1.21
    ports: ["8025:8025"]

volumes:
  pgdata:
  miniodata:
