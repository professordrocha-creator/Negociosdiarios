# Verificações automáticas antes de cada commit.
# Instalar uma vez: `uv tool install pre-commit && pre-commit install`
# Bibliotecas de terceiros ficam idênticas ao original (não corrigir espaços/finais de linha).
exclude: ^(prototipo/css/bootstrap\.min\.css|static/css/bootstrap\.min\.css|static/js/bootstrap\.bundle\.min\.js|static/fonts/OFL-.*\.txt)$
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key

  # Segredos (chaves, tokens): bloqueia o commit se encontrar algo
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # Formatação e lint (configuração em pyproject.toml)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format
