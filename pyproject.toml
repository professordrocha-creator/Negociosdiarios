# Projeto, dependências (gerenciadas pelo uv) e ferramentas de qualidade (ruff e pytest).
# Adicionar pacote: `uv add <pacote>` (ou `uv add --dev <pacote>`). Nunca editar uv.lock à mão.
[project]
name = "negocios-diarios"
version = "0.0.0"
description = "Classificados regionais de imóveis e veículos (Mato Grosso)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "argon2-cffi>=23.1",
    "cairosvg>=2.7",
    "celery[redis]>=5.4",
    "django>=5.2,<5.3",
    "django-axes>=8",
    "django-environ>=0.12",
    "django-otp>=1.5",
    "django-simple-history>=3.7",
    "django-storages[s3]>=1.14",
    "gunicorn>=23",
    "pillow>=11",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-django>=4.9",
    "ruff>=0.7",
]

[tool.uv]
package = false   # é uma aplicação, não uma biblioteca: não empacotar

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["**/migrations/**", "prototipo/"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ", "S"]   # S = regras de segurança (bandit)
ignore = ["S101"]                                 # assert é permitido nos testes

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
